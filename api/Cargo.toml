[package]
name = "seqworks-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.2"
chrono = { version = "0.4.24", features = ["serde"] }
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0.95"
tokio = { version = "1.26.0", features = ["full"] }
tower-http = { version = "0.5.0", features = ["cors", "fs"] }
uuid = { version = "1.3.0", features = ["v4","serde"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tracing = "0.1"
openidconnect = { version = "3", features = ["reqwest"] }
tower-sessions = "0.12"   # for CSRF state storage

pipeline-core = { path = "../crates/pipeline-core" }
jsonwebtoken = "9"

